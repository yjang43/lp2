defaults:
  - launcher: local
  - solver: cem
  - cost: l2
  - _self_

world:
  env_name: swm/TwoRoom-v1
  num_envs: ${eval.num_eval}
  max_episode_steps: ??? # set in eval.py to 2 * eval_budget

seed: 42
policy: random # ckpt name or random

plan_config:
  horizon: 5
  receding_horizon: 5
  action_block: 5 # frameskip

dataset:
  stats: ${eval.dataset_name}
  keys_to_cache:
    - action
    - proprio

# start states and goals are drawn from dataset episodes
eval:
  num_eval: 50
  goal_offset_steps: 25
  eval_budget: 50
  img_size: 224
  dataset_name: tworoom.h5
  callables:
    # -- set state
    - method: _set_state
      args:
        state:
          value: pos_agent
    # -- set goal state
    - method: _set_goal_state
      args:
        goal_state:
          value: goal_pos_agent

output:
  # null: beside the policy, in the checkpoint store
  dir: null
  filename: tworoom_${hydra:runtime.choices.cost}_results.txt
